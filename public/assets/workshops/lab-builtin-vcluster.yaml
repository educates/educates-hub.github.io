apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-builtin-vcluster
spec:
  description: Test of using builtin support for creating a virtual cluster.
  session:
    applications:
      console:
        enabled: true
      editor:
        enabled: true
      files:
        enabled: true
      terminal:
        enabled: true
        layout: split
      vcluster:
        enabled: true
    namespaces:
      budget: medium
      security:
        token:
          enabled: false
  title: Test of builtin virtual cluster
  version: "2.0"
  workshop:
    files:
    - image:
        url: ghcr.io/educates/labs-vcluster-testing/lab-builtin-vcluster-files:2.0
